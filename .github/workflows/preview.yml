name: Preview

# RELEASE.md §4 preview.yml — PR 预览。
# Web 由 Cloudflare Pages 创建静态 preview；M0 不承诺每 PR 一套完整后端。
# 必须真实构建 Web 静态产物；Cloudflare 部署仅在 CLOUDFLARE_API_TOKEN 存在时尝试，
# 但构建步骤绝不跳过。
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview-build:
    name: preview-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node (pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable corepack
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web (required — fails if apps/web is missing)
        run: pnpm --filter @vastworld/web build

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-web
          path: apps/web/dist

      - name: Cloudflare Pages deploy (requires external secret)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Cloudflare Pages preview deploy skipped — CLOUDFLARE_API_TOKEN not configured. Web artifact was still built and uploaded above."
            exit 0
          fi
          echo "Cloudflare Pages deploy requires external project config; out of M0 automation until environments are configured."
